# =====================================================================
# Cuidarte+ · configuracion de nginx para la SPA
#
# CORRECCION DE LA EP3 · incidente INC-EP3-01
#
# La version anterior declaraba las cabeceras de seguridad una sola vez, en
# el bloque `server`, y confiaba en que se heredaran. En nginx NO es asi: en
# cuanto un bloque `location` declara su propio `add_header`, SUSTITUYE por
# completo el conjunto heredado del nivel superior en vez de ampliarlo. Como
# `location /assets/` anadia su `Cache-Control`, todos los archivos .js y
# .css de la aplicacion —es decir, la totalidad del codigo que el navegador
# ejecuta— se servian SIN ninguna cabecera de seguridad.
#
# Lo detectaron de forma independiente la sonda SEG-D2 y el escaneo pasivo de
# OWASP ZAP (reglas 10021 X-Content-Type-Options y 10063 Permissions-Policy).
#
# La correccion consiste en definir las cabeceras en un fragmento unico e
# incluirlo explicitamente en cada `location`, de modo que la herencia deje de
# ser un supuesto y pase a ser una declaracion verificable.
# =====================================================================

server {
    listen 5173;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # No revelar la version del servidor (OWASP A05).
    server_tokens off;

    # Cabeceras de seguridad del nivel servidor: aplican a las respuestas que
    # no entran en ningun `location` con `add_header` propio (NFR-SEG-10).
    include /etc/nginx/cabeceras-seguridad.conf;

    # La API se expone por el mismo origen: asi la SPA no necesita CORS
    # permisivo y la politica del backend se prueba de forma realista.
    #
    # Aqui NO se incluyen las cabeceras: las emite la propia API, que es la
    # autoridad sobre sus respuestas. Duplicarlas produciria cabeceras
    # repetidas y politicas en conflicto.
    location /api/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 12m;
    }

    # Enrutado de SPA: cualquier ruta desconocida devuelve index.html.
    location / {
        try_files $uri $uri/ /index.html;

        include /etc/nginx/cabeceras-seguridad.conf;
        # INC-EP3-05: el documento HTML no se almacena en cache. Es el que
        # arrastra la sesion rehidratada y no lleva hash en el nombre, de modo
        # que una copia cacheada sobrevive al despliegue de una correccion.
        add_header Cache-Control "no-store" always;
    }

    # Los assets llevan un hash en el nombre: un cambio de contenido cambia la
    # URL, por lo que se pueden cachear indefinidamente sin riesgo de servir
    # una version obsoleta.
    location /assets/ {
        # Las cabeceras se repiten aqui a proposito: ver la nota de INC-EP3-01
        # al comienzo de este archivo.
        include /etc/nginx/cabeceras-seguridad.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
}
