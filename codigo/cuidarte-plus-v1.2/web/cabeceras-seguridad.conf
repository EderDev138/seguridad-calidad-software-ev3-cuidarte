# =====================================================================
# Cuidarte+ · Cabeceras de seguridad HTTP de la SPA (NFR-SEG-10)
#
# Fragmento unico incluido desde `nginx.conf` en el bloque `server` y en cada
# `location` que declara cabeceras propias. Existe porque en nginx un
# `add_header` dentro de un `location` sustituye —no amplia— el conjunto
# heredado del nivel superior (incidente INC-EP3-01 de la EP3).
#
# | Cabecera                    | Protege contra                      | Norma            |
# |-----------------------------|-------------------------------------|------------------|
# | X-Content-Type-Options      | interpretacion erronea del tipo MIME| OWASP A05        |
# | X-Frame-Options             | clickjacking                        | OWASP A05        |
# | Referrer-Policy             | fuga de la URL por el referrer      | Ley 19.628       |
# | Permissions-Policy          | uso de camara, microfono y ubicacion| Ley 19.628       |
# | Content-Security-Policy     | inyeccion y XSS                     | OWASP A03        |
# | Strict-Transport-Security   | degradacion de HTTPS a HTTP         | NFR-SEG-1        |
# | Cross-Origin-Embedder-Policy| canales laterales entre origenes    | OWASP A05        |
# | Cross-Origin-Opener-Policy  | manipulacion de la ventana abridora | OWASP A05        |
#
# `always` hace que la cabecera se emita tambien en las respuestas de error
# (4xx y 5xx), que son justamente las que un atacante provoca a proposito.
# =====================================================================

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

# HSTS: en QA la aplicacion se sirve por HTTP, pero la cabecera se declara
# para que la configuracion sea la misma que en produccion (NFR-SEG-1).
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# INC-EP3-05: aislamiento de origen cruzado (regla 90004 de OWASP ZAP).
add_header Cross-Origin-Embedder-Policy "credentialless" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
